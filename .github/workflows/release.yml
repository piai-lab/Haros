name: Desktop Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Build Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source_provenance.outputs.version }}
      source_commit: ${{ steps.source_provenance.outputs.source_commit }}
      source_tag: ${{ steps.source_provenance.outputs.source_tag }}
      lockfile_sha256: ${{ steps.source_provenance.outputs.lockfile_sha256 }}
      ref: ${{ steps.source_provenance.outputs.source_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - id: source_provenance
        name: Resolve version and verify exact build source
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/verify-release-source-provenance.ts \
            "$RELEASE_VERSION" \
            false \
            "$EXPECTED_COMMIT" \
            "$SOURCE_REF_TYPE" \
            "$SOURCE_REF_NAME"

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build unsigned desktop artifact
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OMNIMIND_PUBLISH_RELEASE: "false"
          VITE_PUBLIC_SITE_ORIGIN: https://omnimind.wisdomeyes.cn
          VITE_FEEDBACK_ENDPOINT: https://omnimind.wisdomeyes.cn/api/v1/feedback
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          SOURCE_TAG: ${{ needs.preflight.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ needs.preflight.outputs.lockfile_sha256 }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --source-commit "$SOURCE_COMMIT"
            --lockfile-sha256 "$LOCKFILE_SHA256"
            --output-dir release
            --verbose
          )
          if [[ -n "$SOURCE_TAG" ]]; then
            args+=(--source-tag "$SOURCE_TAG")
          fi
          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Collect build assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-assets
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/latest*.yml"; do
            for file in $pattern; do
              cp "$file" build-assets/
            done
          done

      - name: Verify and record artifact provenance
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          SOURCE_TAG: ${{ needs.preflight.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ needs.preflight.outputs.lockfile_sha256 }}
        run: |
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir build-assets \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --publication false \
            --signed false \
            --allow-unsigned-windows-publication false

      - name: Smoke packaged desktop startup
        shell: bash
        run: |
          node scripts/verify-packaged-desktop.ts \
            --assets-dir build-assets \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --source-commit "${{ needs.preflight.outputs.source_commit }}" \
            --proof startup

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: build-assets/*
          if-no-files-found: error
          retention-days: 5
