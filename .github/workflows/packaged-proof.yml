name: Unsigned Packaged Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: packaged-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Freeze source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      lockfile_sha256: ${{ steps.identity.outputs.lockfile_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: identity
        name: Record immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          lockfile_sha256="$(sha256sum bun.lock | cut -d' ' -f1)"
          {
            echo "version=$version"
            echo "source_commit=${GITHUB_SHA}"
            echo "lockfile_sha256=$lockfile_sha256"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 packaged journey
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
            proof: journey
          - label: Linux x64 startup smoke
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            proof: startup
          - label: Windows x64 startup smoke
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
            proof: startup
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.source_commit }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build unsigned artifact
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          HARNESSOS_PUBLISH_RELEASE: "false"
          SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
          LOCKFILE_SHA256: ${{ needs.source.outputs.lockfile_sha256 }}
        run: |
          bun run dist:desktop:artifact -- \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.source.outputs.version }}" \
            --source-commit "$SOURCE_COMMIT" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --output-dir packaged-proof \
            --verbose

      - name: Collect proof inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-assets
          shopt -s nullglob
          for pattern in \
            "packaged-proof/*.dmg" \
            "packaged-proof/*.AppImage" \
            "packaged-proof/*.exe"; do
            for file in $pattern; do
              cp "$file" proof-assets/
            done
          done
          test -n "$(find proof-assets -maxdepth 1 -type f -print -quit)"

      - name: Verify isolated packaged behavior
        shell: bash
        run: |
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir proof-assets \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.source.outputs.version }}" \
            --source-commit "${{ needs.source.outputs.source_commit }}" \
            --lockfile-sha256 "${{ needs.source.outputs.lockfile_sha256 }}" \
            --publication false \
            --signed false \
            --allow-unsigned-windows-publication false
          node scripts/verify-packaged-desktop.ts \
            --assets-dir proof-assets \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.source.outputs.version }}" \
            --source-commit "${{ needs.source.outputs.source_commit }}" \
            --proof "${{ matrix.proof }}"

      - name: Upload short-lived unsigned proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-proof-${{ matrix.platform }}-${{ matrix.arch }}
          path: proof-assets/*
          if-no-files-found: error
          retention-days: 3
