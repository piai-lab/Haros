<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ZQ UI Review</title>
    <style>
      :root {
        --bg: #f3f2ee;
        --panel: rgba(255, 255, 252, 0.88);
        --panel-solid: #fffefa;
        --ink: #171714;
        --muted: #6f6c64;
        --line: rgba(23, 23, 20, 0.12);
        --accent: #ec5b37;
        --accent-ink: #fff8f3;
        --focus: #2368e8;
        --shadow: 0 24px 70px rgba(40, 35, 25, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11110f;
          --panel: rgba(27, 27, 24, 0.9);
          --panel-solid: #1b1b18;
          --ink: #f4f2e9;
          --muted: #aaa69c;
          --line: rgba(244, 242, 233, 0.13);
          --accent: #ff7654;
          --accent-ink: #24100b;
          --focus: #86abff;
          --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        }
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 78% 4%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 27rem),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.012em;
      }
      button, input { font: inherit; }
      button:focus-visible, input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .shell {
        display: grid;
        grid-template-columns: 268px minmax(0, 1fr);
        min-height: 100vh;
      }
      .rail {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 22px 18px;
        border-right: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel-solid) 72%, transparent);
        backdrop-filter: blur(18px);
        overflow: auto;
      }
      .eyebrow {
        margin: 0 0 7px;
        color: var(--accent);
        font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: 22px; line-height: 1.1; letter-spacing: -0.04em; }
      .surface { margin: 8px 0 20px; color: var(--muted); font-size: 13px; }
      .search {
        width: 100%;
        height: 38px;
        margin-bottom: 12px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-solid);
        color: var(--ink);
      }
      .directions { display: grid; gap: 7px; }
      .direction {
        width: 100%;
        padding: 11px 10px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .direction:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
      .direction[aria-current="true"] {
        border-color: var(--line);
        background: var(--panel-solid);
        box-shadow: 0 7px 22px rgba(30, 28, 22, 0.06);
      }
      .direction strong { display: block; font-size: 13px; }
      .direction span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .rail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 18px; }
      .action {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-solid);
        color: var(--ink);
        cursor: pointer;
      }
      .action.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
      .main { min-width: 0; padding: 18px; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 48px;
        margin: 0 auto 14px;
        max-width: 1680px;
      }
      .topbar-copy { min-width: 0; }
      .topbar h2 { margin: 0; font-size: 15px; letter-spacing: -0.02em; }
      .hypothesis { margin: 5px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      .badge { padding: 5px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; }
      .badge.counter { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); color: var(--accent); }
      .stage {
        max-width: 1680px;
        height: calc(100vh - 98px);
        min-height: 620px;
        margin: auto;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--panel-solid);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
      .compare-grid { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 100%; }
      .compare-grid.active { display: grid; }
      .compare-cell { min-width: 0; border-right: 1px solid var(--line); }
      .compare-cell:last-child { border-right: 0; }
      .compare-cell header { height: 34px; padding: 9px 11px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .compare-cell iframe { height: calc(100% - 34px); }
      .empty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 30px; }
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-solid);
        box-shadow: var(--shadow);
        font-size: 12px;
      }
      @media (max-width: 820px) {
        .shell { grid-template-columns: 1fr; }
        .rail { position: static; width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        .directions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .main { padding: 10px; }
        .stage { height: 72vh; min-height: 520px; border-radius: 11px; }
        .topbar { align-items: flex-start; }
        .hypothesis { white-space: normal; }
        .badges { display: none; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .direction, .action { transition: background-color 140ms ease-out, border-color 140ms ease-out, transform 140ms ease-out; }
        .action:active { transform: scale(0.98); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <p class="eyebrow">Human decides</p>
        <h1>ZQ UI Review</h1>
        <p class="surface" id="surface"></p>
        <label>
          <span class="eyebrow">Filter directions</span>
          <input class="search" id="search" type="search" placeholder="Search title, axis, hypothesis…" />
        </label>
        <nav class="directions" id="directions" aria-label="Design directions"></nav>
        <div class="rail-actions">
          <button class="action primary" id="shortlist" type="button">Shortlist</button>
          <button class="action" id="compare" type="button">Compare</button>
          <button class="action" id="export" type="button">Copy choice</button>
          <button class="action" id="clear" type="button">Clear</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-copy">
            <h2 id="title"></h2>
            <p class="hypothesis" id="hypothesis"></p>
          </div>
          <div class="badges" id="badges"></div>
        </header>
        <section class="stage" aria-label="Live candidate">
          <iframe id="frame" title="Selected design direction"></iframe>
          <div class="compare-grid" id="compare-grid"></div>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script>
      const data = {"surface": "responsive-workbench", "candidates": [{"id": "adaptive-inspector", "title": "已否决｜说明型交互故事板", "hypothesis": "维护者已否决该说明型外壳；只保留为比较证据，禁止进入 production。", "axes": ["automatic-disclosure-vs-manual-preference", "stable-canvas-vs-width-consuming-panels"], "taste_relation": "aligned", "states": ["compact", "environment-open", "transition", "wide", "workbench-open"], "scenarios": ["compact-auto-priority", "environment-invariance", "narrow-environment-sheet", "workbench-wide-split"], "path": "candidates/adaptive-inspector", "digest": "e03e504ded08350f5ffa40eb4de282202fe75e9ffd0de6608e3131f73cd96bba", "registered_at": "2026-08-15T09:23:43+00:00", "refreshed_at": "2026-08-15T09:24:50+00:00", "url": "../candidates/adaptive-inspector/index.html"}, {"id": "omnimind-shell-v2", "title": "OmniMind 真实 Shell · 稳定主画布", "hypothesis": "保留 OmniMind 当前真实 Shell 与密度，只修 Environment、Sidebar 与 Workbench 的空间角色和连续缩放。", "axes": ["authentic-shell-vs-explanatory-demo", "stable-canvas-vs-width-consuming-panels"], "taste_relation": "aligned", "states": ["compact", "environment-open", "transition", "wide", "workbench-open"], "scenarios": ["compact-auto-priority", "environment-invariance", "narrow-environment-sheet", "workbench-wide-split"], "path": "candidates/omnimind-shell-v2", "digest": "32c65b1cbbfa26e9b6ac04e43cfa5333f98c81acce8653990568492e125c5e53", "registered_at": "2026-08-15T10:26:00+00:00", "refreshed_at": "2026-08-15T10:27:15+00:00", "url": "../candidates/omnimind-shell-v2/index.html"}]};
      const key = `zq-ui:${data.surface}:shortlist`;
      const state = {
        active: data.candidates[0]?.id,
        shortlist: new Set(JSON.parse(localStorage.getItem(key) || "[]")),
        compare: false,
      };
      const elements = Object.fromEntries(
        ["surface", "search", "directions", "shortlist", "compare", "export", "clear", "title", "hypothesis", "badges", "frame", "compare-grid", "toast"]
          .map((id) => [id, document.getElementById(id)]),
      );
      const candidate = (id) => data.candidates.find((item) => item.id === id);
      const save = () => localStorage.setItem(key, JSON.stringify([...state.shortlist]));
      function notify(message) {
        elements.toast.textContent = message;
        elements.toast.hidden = false;
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => (elements.toast.hidden = true), 1800);
      }
      function renderRail(query = "") {
        const normalized = query.toLowerCase();
        elements.directions.replaceChildren();
        for (const item of data.candidates) {
          const haystack = [item.title, item.hypothesis, ...(item.axes || [])].join(" ").toLowerCase();
          if (normalized && !haystack.includes(normalized)) continue;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "direction";
          button.setAttribute("aria-current", String(item.id === state.active));
          button.innerHTML = `<strong>${state.shortlist.has(item.id) ? "● " : ""}${item.title}</strong><span>${item.axes.join(" · ")}</span>`;
          button.addEventListener("click", () => { state.active = item.id; state.compare = false; render(); });
          elements.directions.append(button);
        }
      }
      function renderCompare() {
        const items = [...state.shortlist].map(candidate).filter(Boolean).slice(0, 3);
        elements["compare-grid"].replaceChildren();
        if (!state.compare || items.length < 2) {
          elements["compare-grid"].classList.remove("active");
          elements.frame.hidden = false;
          return;
        }
        elements.frame.hidden = true;
        elements["compare-grid"].classList.add("active");
        for (const item of items) {
          const cell = document.createElement("div");
          cell.className = "compare-cell";
          cell.innerHTML = `<header>${item.title}</header><iframe title="${item.title}" src="${item.url}"></iframe>`;
          elements["compare-grid"].append(cell);
        }
        elements["compare-grid"].style.gridTemplateColumns = `repeat(${items.length}, minmax(0, 1fr))`;
      }
      function render() {
        const item = candidate(state.active);
        elements.surface.textContent = data.surface;
        renderRail(elements.search.value);
        if (!item) return;
        elements.title.textContent = item.title;
        elements.hypothesis.textContent = item.hypothesis;
        elements.badges.innerHTML = [...item.axes, item.taste_relation]
          .map((label) => `<span class="badge ${label === "counter-prior" ? "counter" : ""}">${label}</span>`).join("");
        elements.frame.src = item.url;
        elements.shortlist.textContent = state.shortlist.has(item.id) ? "Remove" : "Shortlist";
        elements.compare.textContent = state.compare ? "Single" : "Compare";
        renderCompare();
      }
      elements.search.addEventListener("input", () => renderRail(elements.search.value));
      elements.shortlist.addEventListener("click", () => {
        if (state.shortlist.has(state.active)) state.shortlist.delete(state.active);
        else state.shortlist.add(state.active);
        save(); render();
      });
      elements.compare.addEventListener("click", () => {
        if (state.shortlist.size < 2) return notify("Shortlist at least two directions first");
        state.compare = !state.compare; render();
      });
      elements.clear.addEventListener("click", () => { state.shortlist.clear(); state.compare = false; save(); render(); });
      elements.export.addEventListener("click", async () => {
        const payload = JSON.stringify({ surface: data.surface, candidates: [...state.shortlist], message: "" }, null, 2);
        await navigator.clipboard.writeText(payload);
        notify("Choice copied — add your exact decision message");
      });
      render();
    </script>
  </body>
</html>
