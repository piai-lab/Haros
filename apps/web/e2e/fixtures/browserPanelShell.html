<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
    <style>
      :root {
        --color-background-control-opaque: rgb(27, 27, 29);
        --composer-surface: rgba(27, 27, 29, 0.18);
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111827;
      }
      [data-omnimind-browser-viewport] {
        position: fixed !important;
        left: 120px !important;
        top: 46px !important;
        width: 640px !important;
        height: 480px !important;
      }
      [data-omnimind-browser-viewport] webview {
        display: flex;
        width: 100%;
        height: 100%;
        background: white;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", (event) => {
        document.documentElement.dataset.rendererError = event.message;
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.documentElement.dataset.rendererError = String(event.reason);
      });
    </script>
    <script type="module" src="../../.playwright/electron-e2e/browserPanelRenderer.js"></script>
  </body>
</html>
