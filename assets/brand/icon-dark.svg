    <rect x="28" y="41" width="18" height="42" rx="7" fill="#FBFAF6"/>
    <rect x="55" y="33" width="18" height="50" rx="7" fill="#8792A3"/>
    <rect x="82" y="47" width="18" height="36" rx="7" fill="#40BEBC"/>
    <path d="M28 91H100" stroke="#FBFAF6" stroke-width="7" stroke-linecap="round"/>
