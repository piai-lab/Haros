<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OmniMind app icon, dark theme</title>
  <desc id="desc">Agent Dock: one full-bleed local workbench tile with parallel agent slots and a centered execution rail.</desc>
  <defs>
    <linearGradient id="dockDepthDark" x1="18" y1="6" x2="112" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#253044" stop-opacity="0.78"/>
      <stop offset="0.48" stop-color="#111722" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#05080D" stop-opacity="0.74"/>
    </linearGradient>
    <radialGradient id="dockCornerDark" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 18) rotate(45) scale(96)">
      <stop stop-color="#344154" stop-opacity="0.62"/>
      <stop offset="0.58" stop-color="#111722" stop-opacity="0"/>
