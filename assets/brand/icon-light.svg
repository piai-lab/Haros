<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OmniMind app icon, light theme</title>
  <desc id="desc">Agent Dock: one full-bleed local workbench tile with parallel agent slots and a centered execution rail.</desc>
  <defs>
    <linearGradient id="dockDepthLight" x1="18" y1="8" x2="110" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" stop-opacity="0.72"/>
      <stop offset="0.56" stop-color="#F3F6FA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E6ECF4" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="dockCornerLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(26 20) rotate(46) scale(104)">
      <stop stop-color="#F8FAFC" stop-opacity="0.30"/>
      <stop offset="0.52" stop-color="#F8FAFC" stop-opacity="0"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0 0) scale(8)">
    <rect x="4" y="4" width="120" height="120" rx="30" fill="#EEF1F5"/>
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#dockDepthLight)"/>
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#dockCornerLight)"/>
    <rect x="28" y="41" width="18" height="42" rx="7" fill="#0D121A"/>
    <rect x="55" y="33" width="18" height="50" rx="7" fill="#69758A"/>
    <rect x="82" y="47" width="18" height="36" rx="7" fill="#2E9D9C"/>
    <path d="M28 91H100" stroke="#0D121A" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
